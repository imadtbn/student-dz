<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>دليل المدارس والمعاهد - Student DZ</title><meta name="description" content="دليل المدارس والمعاهد في الجزائر."><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="icon" href="../assets/images/icon.png"><script src="../assets/js/config.js"></script><script src="../assets/js/schema-directory.js" defer></script></head><body><header class="site-header"><div class="container"><a href="../index.html" class="logo"><img src="../assets/images/icon.png" width="32" height="32"> Student DZ</a><nav class="main-nav" id="mainNav"><a href="../index.html" class="nav-link">الرئيسية</a><a href="../universities/index.html" class="nav-link">الجامعات</a><a href="../ecoles/index.html" class="nav-link">المدارس والمعاهد</a><a href="../residences/index.html" class="nav-link">الإقامات</a><a href="../transport/index.html" class="nav-link">النقل</a><a href="../tools/maps.html" class="nav-link">الخريطة</a><a href="../categories/tools.html" class="nav-link">الأدوات</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button><button class="hamburger" id="menuToggle">☰</button></div></div></header><main class="container" style="padding-top:2rem;padding-bottom:4rem"><h1 class="section-title"><i class="fa-solid fa-school"></i> دليل المدارس والمعاهد</h1><div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap"><button id="btnNearMe" class="btn btn-outline">الأقرب إليّ</button><input id="searchInput" style="flex:1;min-width:250px;padding:12px;border:1px solid var(--border-color);border-radius:8px" placeholder="ابحث عن مدرسة أو ولاية..."></div><div id="ecolesGrid" class="grid"><p style="grid-column:1/-1;text-align:center">جاري تحميل البيانات...</p></div><div style="text-align:center;margin-top:2rem"><button id="btnLoadMore" class="btn btn-outline" style="display:none">المزيد</button></div></main><script src="../assets/js/config.js"></script><script src="../assets/js/theme.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/js/favorites-ui.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const grid=document.getElementById('ecolesGrid'),search=document.getElementById('searchInput'),more=document.getElementById('btnLoadMore'),near=document.getElementById('btnNearMe');let all=[],current=[],shown=0;const size=8;try{const r=await fetch(CONFIG.getUrl('data/ecoles.json'));if(!r.ok)throw new Error('HTTP '+r.status);all=await r.json();current=[...all];render()}catch(e){console.error(e);grid.innerHTML='<p style="grid-column:1/-1;text-align:center">تعذر تحميل البيانات.</p>'}function render(append=false){if(!append){grid.innerHTML='';shown=0}const items=current.slice(shown,shown+size);items.forEach(e=>{const map=e.position?`https://www.google.com/maps/dir/?api=1&destination=${e.position.lat},${e.position.lng}`:'#';const specs=(e.specialties||[]).map(s=>`<span class="directory-specialty">${s}</span>`).join('');const verification=e.verified===true?'verified':(e.verificationStatus||'pending');grid.insertAdjacentHTML('beforeend',`<div class="card ecole-card favorite-card" data-verification-status="${verification}" data-favorite-id="school:${e.id||e.officialUrl||e.name}" data-favorite-title="${e.name}" data-favorite-url="${e.officialUrl||'#'}" data-favorite-type="schools" data-favorite-icon="fa-solid fa-school" data-favorite-description="${e.wilaya||''}"><h3 class="card-title">${e.name}</h3><p class="card-desc">${e.wilaya||''}</p><div class="directory-specialties">${specs}</div><div style="display:flex;gap:8px;width:100%;margin-top:auto"><a href="${e.officialUrl||'#'}" target="_blank" rel="noopener" class="btn btn-outline" style="flex:1;text-align:center">الموقع</a>${e.position?`<a href="${map}" target="_blank" rel="noopener" class="btn btn-outline" style="flex:1;text-align:center">مسار</a>`:''}</div></div>`)});shown+=items.length;more.style.display=shown<current.length?'inline-block':'none'}search.addEventListener('input',()=>{const t=search.value.toLowerCase().trim();current=all.filter(e=>e.name.toLowerCase().includes(t)||e.wilaya.toLowerCase().includes(t)||(e.specialties||[]).some(s=>s.toLowerCase().includes(t)));render()});more.addEventListener('click',()=>render(true));near.addEventListener('click',()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{current=[...all].map(e=>{e.distance=e.position?Math.hypot((e.position.lat-p.coords.latitude)*111,(e.position.lng-p.coords.longitude)*90):999999;return e}).sort((a,b)=>a.distance-b.distance);render()})})});</script><footer class="site-footer"><div class="container"><div class="footer-bottom">&copy; <span id="currentYear"></span> Student DZ</div></div></footer><script src="../assets/js/navigation.js"></script></body></html>
