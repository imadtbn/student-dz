<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصات الجامعية - Student DZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="../assets/js/config.js"></script>
    <style>
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar input {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: inherit;
            background: var(--bg-main);
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-graduation-cap"></i> Student DZ
            </a>

            <nav class="main-nav" id="mainNav">
                <a href="../index.html" class="nav-link">الرئيسية</a>
                <a href="../categories/tools.html" class="nav-link">الأدوات</a>
                <a href="../universities/index.html" class="nav-link">الجامعات</a>
                <a href="../ecoles/index.html" class="nav-link">المدارس العليا</a>
                <a href="../platforms/index.html" class="nav-link">المنصات</a>
                <a href="../residences/index.html" class="nav-link">الإقامات</a>
            </nav>

            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" aria-label="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
                <button class="hamburger" id="menuToggle" aria-label="القائمة">☰</button>
            </div>
        </div>
    </header>

    <main class="container">
        <h1 class="section-title" style="margin-top:2rem;"><i class="fa-solid fa-globe"></i> دليل المنصات الرسمية</h1>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="ابحث عن منصة...">
        </div>

        <div class="grid" id="platGrid">
            <div style="text-align:center; grid-column: 1/-1;"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل البيانات...</div>
        </div>
    </main>

    <script src="../assets/js/app.js"></script>
    <script>
        let platforms = [];

        function renderGrid(data) {
            const grid = document.getElementById('platGrid');
            grid.innerHTML = '';
            if(data.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">لا توجد نتائج.</p>';
                return;
            }
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="card" style="text-align:right; align-items:flex-start;">
                        <h3 class="card-title">${p.name}</h3>
                        <p class="card-desc" style="margin-top:10px;">${p.description}</p>
                        <a href="${p.officialUrl}" target="_blank" class="btn btn-outline" style="margin-top:auto; width:100%; text-align:center;"><i class="fa-solid fa-arrow-up-right-from-square"></i> دخول للمنصة</a>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const data = await fetchAppJSON(CONFIG.API.PLATFORMS);
            if(data && data.platforms) {
                platforms = data.platforms;
                renderGrid(platforms);
            }
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = platforms.filter(p => p.name.toLowerCase().includes(term) || p.description.toLowerCase().includes(term));
            renderGrid(filtered);
        });
    </script>
</body>
</html>
