<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>الإقامات الجامعية - Student DZ</title><meta name="description" content="دليل الإقامات الجامعية في الجزائر."><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="icon" href="../assets/images/icon.png"><script src="../assets/js/config.js"></script></head><body><header class="site-header"><div class="container"><a href="../index.html" class="logo"><img src="../assets/images/icon.png" width="32" height="32"> Student DZ</a><nav class="main-nav" id="mainNav"><a href="../index.html" class="nav-link">الرئيسية</a><a href="../universities/index.html" class="nav-link">الجامعات</a><a href="../ecoles/index.html" class="nav-link">المدارس والمعاهد</a><a href="../residences/index.html" class="nav-link">الإقامات</a><a href="../categories/tools.html" class="nav-link">الأدوات</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button><button class="hamburger" id="menuToggle">☰</button></div></div></header><main class="container"><h1 class="section-title" style="margin-top:2rem"><i class="fa-solid fa-building"></i> دليل الإقامات الجامعية</h1><div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap"><button id="btnNearMe" class="btn btn-outline">الأقرب إليّ</button><input id="searchInput" style="flex:1;min-width:220px;padding:12px;border:1px solid var(--border-color);border-radius:8px" placeholder="ابحث باسم الإقامة أو الولاية..."><select id="genderFilter" style="padding:12px;border:1px solid var(--border-color);border-radius:8px"><option value="">جميع الفئات</option><option value="male">ذكور</option><option value="female">إناث</option></select></div><div class="grid" id="resGrid"><p style="grid-column:1/-1;text-align:center">جاري تحميل البيانات...</p></div><div style="text-align:center;margin-top:2rem"><button id="btnLoadMore" class="btn" style="display:none">المزيد من الإقامات</button></div></main><script src="../assets/js/storage.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/favorites-ui.js"></script><script>let residences=[],currentData=[],shown=0;const size=8;function render(append=false){const g=document.getElementById('resGrid');if(!append){g.innerHTML='';shown=0}const items=currentData.slice(shown,shown+size);items.forEach(r=>{const isMale=r.gender==='male',gender=isMale?'ذكور':'إناث',genderIcon=isMale?'fa-person':'fa-person-dress',genderClass=isMale?'residence-male':'residence-female',map=r.coordinates?`https://www.google.com/maps/dir/?api=1&destination=${r.coordinates.lat},${r.coordinates.lng}`:'#',verification=r.verificationStatus||'pending';g.insertAdjacentHTML('beforeend',`<div class="card favorite-card" data-verification-status="${verification}" data-favorite-id="residence:${r.id||r.name}" data-favorite-title="${r.name}" data-favorite-url="${map}" data-favorite-type="residences" data-favorite-icon="fa-solid fa-building" data-favorite-description="ولاية ${r.wilaya} — ${gender}"><h3 class="card-title">${r.name}</h3><p class="card-desc residence-wilaya"><strong>${r.wilaya}</strong> <i class="fa-solid fa-location-dot residence-location-icon" aria-hidden="true"></i></p><p class="card-desc residence-gender"><strong>الفئة:</strong> <span class="residence-gender-label ${genderClass}"><i class="fa-solid ${genderIcon}" aria-hidden="true"></i> ${gender}</span></p><div style="width:100%;margin-top:auto">${r.coordinates?`<a href="${map}" target="_blank" rel="noopener" class="btn btn-outline residence-map-btn" style="display:block;text-align:center"><i class="fa-solid fa-location-dot" aria-hidden="true"></i> الموقع الجغرافي</a>`:''}</div></div>`)});shown+=items.length;document.getElementById('btnLoadMore').style.display=shown<currentData.length?'inline-block':'none'}async function init(){const data=await fetchAppJSON(CONFIG.API.RESIDENCES);if(data&&Array.isArray(data.residences)){residences=data.residences;currentData=[...residences];render()}else{document.getElementById('resGrid').innerHTML='<p style="grid-column:1/-1;text-align:center">تعذر تحميل بيانات الإقامات.</p>';console.error('Residence data has an unexpected structure.')}}document.addEventListener('DOMContentLoaded',init);function filter(){const t=document.getElementById('searchInput').value.toLowerCase().trim(),g=document.getElementById('genderFilter').value;currentData=residences.filter(r=>(String(r.name||'').toLowerCase().includes(t)||String(r.wilaya||'').toLowerCase().includes(t))&&(!g||r.gender===g));render()}document.getElementById('searchInput').addEventListener('input',filter);document.getElementById('genderFilter').addEventListener('change',filter);document.getElementById('btnLoadMore').addEventListener('click',()=>render(true));document.getElementById('btnNearMe').addEventListener('click',()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{currentData=[...residences].map(r=>{r.distance=r.coordinates?Math.hypot((r.coordinates.lat-p.coords.latitude)*111,(r.coordinates.lng-p.coords.longitude)*90):999999;return r}).sort((a,b)=>a.distance-b.distance);render()})});</script><script src="../assets/js/navigation.js"></script></body></html>
