<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإقامات الجامعية - Student DZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="../assets/js/config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <div class="container"><a href="../index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i> Student DZ</a></div>
    </header>

    <main class="container">
        <h1 class="section-title" style="margin-top:2rem;">دليل الإقامات الجامعية</h1>
        <div class="grid" id="resGrid"></div>
    </main>

    <script src="../assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const data = await fetchAppJSON(CONFIG.API.RESIDENCES);
            const grid = document.getElementById('resGrid');

            if(data && data.residences) {
                data.residences.forEach(r => {
                    grid.innerHTML += `
                        <div class="card" style="text-align:right; align-items:flex-start;">
                            <h3 class="card-title">🏢 ${r.name}</h3>
                            <p class="card-desc">📍 ولاية ${r.wilaya}</p>
                            <p class="card-desc">الفئة: ${r.gender === 'male' ? 'ذكور' : 'إناث'}</p>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
