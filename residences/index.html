<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإقامات الجامعية - Student DZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="../assets/js/config.js"></script>
    <style>
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: inherit;
            background: var(--bg-main);
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container"><a href="../index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i> Student DZ</a></div>
    </header>

    <main class="container">
        <h1 class="section-title" style="margin-top:2rem;"><i class="fa-solid fa-building"></i> دليل الإقامات الجامعية</h1>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="ابحث باسم الإقامة أو الولاية...">
            <select id="genderFilter">
                <option value="">جميع الفئات (ذكور/إناث)</option>
                <option value="male">ذكور</option>
                <option value="female">إناث</option>
            </select>
        </div>

        <div class="grid" id="resGrid">
            <div style="text-align:center; grid-column: 1/-1;"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل البيانات...</div>
        </div>
    </main>

    <script src="../assets/js/app.js"></script>
    <script>
        let residences = [];

        function renderGrid(data) {
            const grid = document.getElementById('resGrid');
            grid.innerHTML = '';
            if(data.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">لا توجد نتائج.</p>';
                return;
            }
            data.forEach(r => {
                const genderIcon = r.gender === 'male' ? '<i class="fa-solid fa-mars" style="color:#3498db;"></i> ذكور' : '<i class="fa-solid fa-venus" style="color:#e74c3c;"></i> إناث';
                grid.innerHTML += `
                    <div class="card" style="text-align:right; align-items:flex-start;">
                        <h3 class="card-title">${r.name}</h3>
                        <p class="card-desc" style="margin: 5px 0;"><i class="fa-solid fa-location-dot"></i> ولاية ${r.wilaya}</p>
                        <p class="card-desc">الفئة: ${genderIcon}</p>
                    </div>
                `;
            });
        }

        async function init() {
            const data = await fetchAppJSON(CONFIG.API.RESIDENCES);
            if(data && data.residences) {
                residences = data.residences;
                renderGrid(residences);
            }
        }

        function applyFilters() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const gender = document.getElementById('genderFilter').value;

            const filtered = residences.filter(r => {
                const matchTerm = r.name.toLowerCase().includes(term) || r.wilaya.toLowerCase().includes(term);
                const matchGender = gender === '' || r.gender === gender;
                return matchTerm && matchGender;
            });
            renderGrid(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('genderFilter').addEventListener('change', applyFilters);

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
