<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>حساب الأيام بين تاريخين - Student DZ</title>
    <meta name="description" content="احسب الفرق بين تاريخين بالأيام والأسابيع والأشهر والسنوات.">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="../assets/images/icon.png">
    <style>
        .tool-container {
            max-width: 700px;
            margin: 2rem auto;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md)
        }

        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 7px
        }

        .input-group label {
            font-weight: 700
        }

        .input-group input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-family)
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            text-align: center;
            background: var(--primary-light);
            color: white;
            border-radius: var(--radius-md)
        }

        .result strong {
            font-size: 1.8rem
        }

        @media(max-width:600px) {
            .tool-grid {
                grid-template-columns: 1fr
            }

            .tool-container {
                padding: 1rem
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo"><img src="../assets/images/icon.png" alt="Student DZ" width="32"
                    height="32"> Student DZ</a>
            <nav class="main-nav" id="mainNav">
                <a href="../index.html" class="nav-link">الرئيسية</a>
                <a href="../universities/index.html" class="nav-link">الجامعات</a>
                <a href="../ecoles/index.html" class="nav-link">المدارس والمعاهد</a>
                <a href="../residences/index.html" class="nav-link">الإقامات</a>
                <a href="../transport/index.html" class="nav-link">النقل</a>
                <a href="../tools/maps.html" class="nav-link">الخريطة</a>
                <a href="../categories/tools.html" class="nav-link">الأدوات</a>
                <a href="../categories/student-life.html" class="nav-link">الحياة الجامعية</a>
            </nav>
            <div class="header-actions"><button class="icon-btn" id="themeToggle"><i
                        class="fa-solid fa-moon"></i></button><button class="hamburger" id="menuToggle">☰</button></div>
        </div>
    </header>
    <main class="container">
        <div class="tool-container">
            <h1 class="section-title" style="margin-top:2rem;"><i class="fa-solid fa-calendar-week"></i>حساب عدد الأيام
                بين تاريخين</h1>
            <p style="text-align:center;color:var(--text-muted);margin-bottom:2rem">احسب المدة بين تاريخين بدقة.</p>
            <div class="tool-grid">
                <div class="input-group"><label for="start">التاريخ الأول</label><input id="start" type="date"></div>
                <div class="input-group"><label for="end">التاريخ الثاني</label><input id="end" type="date"></div>
            </div><button class="btn" id="calc" style="width:100%;margin-top:20px"><i
                    class="fa-solid fa-calendar-days"></i> احسب الفرق</button>
            <div class="result" id="result"><strong id="days">0</strong>
                <div>يوم</div>
                <p id="details"></p>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">&copy; <span id="currentYear"></span> Student DZ. جميع الحقوق محفوظة.</div>
        </div>
    </footer>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/navigation.js"></script>
    <script>const start = document.getElementById('start'), end = document.getElementById('end'), today = new Date(); start.value = today.toISOString().slice(0, 10); end.value = today.toISOString().slice(0, 10); document.getElementById('calc').onclick = () => { const a = new Date(start.value + 'T00:00:00'), b = new Date(end.value + 'T00:00:00'); if (Number.isNaN(a.getTime()) || Number.isNaN(b.getTime())) return; const diff = Math.abs(b - a), days = Math.round(diff / 86400000), weeks = Math.floor(days / 7), rem = days % 7; document.getElementById('days').textContent = days.toLocaleString('ar-DZ'); document.getElementById('details').textContent = days + ' يوم = ' + weeks + ' أسبوع و ' + rem + ' يوم'; document.getElementById('result').style.display = 'block' };</script>
</body>

</html>
