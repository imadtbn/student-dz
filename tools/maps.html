<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>خريطة الطالب - Student DZ</title>
<meta name="description" content="خريطة الطالب للبحث عن الجامعات والمدارس والمعاهد والإقامات الجامعية وتحديد مواقعها بسهولة.">
<meta name="theme-color" content="#007A5E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
<script src="../assets/js/config.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" href="../assets/images/icon.png">
<style>
.map-container{width:100%;height:65vh;border-radius:var(--radius-lg);margin:20px 0;z-index:1}
.map-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.map-search{grid-column:1/-1;position:relative;z-index:100}
.map-search .search-input{padding:13px 45px 13px 15px;border:1px solid var(--border-color);box-shadow:none;background:var(--bg-card);color:var(--text-main)}
.map-search>i{position:absolute;right:17px;top:15px;color:var(--text-muted);z-index:2}
.map-search .search-results-container{top:calc(100% + 8px)}
.map-category-buttons{display:flex;flex-wrap:wrap;gap:8px;grid-column:1/-1}
.map-category-buttons .btn{flex:1 1 180px;text-align:center}
.map-category-buttons .btn.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}
@media(max-width:600px){.map-tools{grid-template-columns:1fr}.map-container{height:62vh}.map-category-buttons .btn{flex:1 1 100%}}
</style>
</head>
<body>
<header class="site-header"><div class="container"><a href="../index.html" class="logo"><img src="../assets/images/icon.png" alt="Student DZ" width="32" height="32" style="border-radius:8px"> Student DZ</a><nav class="main-nav" id="mainNav"><a href="../index.html" class="nav-link">الرئيسية</a><a href="../universities/index.html" class="nav-link">الجامعات</a><a href="../ecoles/index.html" class="nav-link">المدارس والمعاهد</a><a href="../residences/index.html" class="nav-link">الإقامات</a><a href="../transport/index.html" class="nav-link">النقل</a><a href="../tools/maps.html" class="nav-link">الخريطة</a><a href="../categories/tools.html" class="nav-link">الأدوات</a><a href="../categories/student-life.html" class="nav-link">الحياة الجامعية</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="تبديل الوضع"><i class="fa-solid fa-moon"></i></button><button class="hamburger" id="menuToggle" type="button" aria-label="القائمة" aria-expanded="false" aria-controls="mainNav">☰</button></div></div></header>
<main class="container">
<h1 class="section-title"><i class="fa-solid fa-map-location-dot"></i> خريطة الطالب</h1>
<div class="map-tools">
<div class="map-category-buttons" aria-label="أقسام الخريطة">
<button class="btn btn-outline active" type="button" data-category="all"><i class="fa-solid fa-layer-group"></i> الكل</button>
<button class="btn btn-outline" type="button" data-category="جامعة"><i class="fa-solid fa-building-columns"></i> الجامعات</button>
<button class="btn btn-outline" type="button" data-category="مدرسة / معهد"><i class="fa-solid fa-school"></i> المدارس والمعاهد</button>
<button class="btn btn-outline" type="button" data-category="إقامة"><i class="fa-solid fa-building"></i> الإقامات</button>
</div>
<div class="map-search"><i class="fa-solid fa-magnifying-glass"></i><input id="mapSearch" class="search-input" type="search" autocomplete="off" placeholder="🔎 ابحث عن جامعة، مدرسة، معهد أو إقامة" aria-label="البحث في خريطة الطالب" aria-expanded="false" aria-controls="mapResults" aria-autocomplete="list"><div id="mapResults" class="search-results-container" role="listbox" aria-label="نتائج البحث في الخريطة" style="display:none"></div></div>
<button class="btn btn-outline" id="btnNearMe"><i class="fa-solid fa-location-crosshairs"></i> موقعي</button>
<button class="btn btn-outline" id="clearMapBtn"><i class="fa-solid fa-eraser"></i> محو العلامات</button>
</div>
<div id="map" class="map-container"></div>
</main>
<footer class="site-footer"><div class="container"><div class="footer-bottom">&copy; <span id="currentYear"></span> Student DZ. جميع الحقوق محفوظة.</div></div></footer>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/maps.js"></script>
<script src="../assets/js/storage.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/navigation.js"></script>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
 let userLocation=null,markers=[],places=[],activeCategory='all';
 const map=await initMap('map',36.7538,3.0588,12);
 const search=document.getElementById('mapSearch'),results=document.getElementById('mapResults');
 const categoryButtons=[...document.querySelectorAll('[data-category]')];
 function route(lat,lng){let u=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;if(userLocation)u+=`&origin=${userLocation.lat},${userLocation.lng}`;return `<a href="${u}" target="_blank" rel="noopener">فتح المسار</a>`}
 function clear(){markers.forEach(m=>map&&map.removeLayer(m));markers=[]}
 function addPlace(name,type,lat,lng,extra,url){
  if(!Number.isFinite(Number(lat))||!Number.isFinite(Number(lng)))return;
  const place={name,type,lat:Number(lat),lng:Number(lng),extra:extra||'',url:url||''};places.push(place);
  const content=`${extra||''}${url?`<br><a href="${url}" target="_blank" rel="noopener">الموقع الرسمي</a>`:''}<br>${route(place.lat,place.lng)}`;
  const marker=addMarker(place.lat,place.lng,`${type}: ${name}`,content,type==='جامعة'?'university':type==='إقامة'?'residence':'ecole');
  if(marker)markers.push(marker);
 }
 function filteredPlaces(){return activeCategory==='all'?places:places.filter(p=>p.type===activeCategory)}
 function renderResults(){
  const q=search.value.trim().toLowerCase();
  if(q.length<2){results.style.display='none';search.setAttribute('aria-expanded','false');return}
  const matches=filteredPlaces().filter(p=>`${p.name} ${p.type} ${p.extra}`.toLowerCase().includes(q)).slice(0,10);
  results.innerHTML=matches.length?matches.map((p,i)=>`<button type="button" class="search-result-item" role="option" aria-selected="false" data-index="${places.indexOf(p)}"><span class="search-result-icon"><i class="fa-solid ${p.type==='جامعة'?'fa-building-columns':p.type==='إقامة'?'fa-building':'fa-school'}"></i></span><span class="search-result-content"><strong>${p.name}</strong><small><span class="search-result-type">${p.type}</span>${p.extra?' • '+p.extra:''}</small></span><span class="search-result-arrow"><i class="fa-solid fa-chevron-left"></i></span></button>`).join(''):'<div class="search-result-empty">لا توجد نتائج مطابقة</div>';
  results.style.display='block';search.setAttribute('aria-expanded','true');
 }
 try{
  const [u,r,e]=await Promise.all([fetchAppJSON(CONFIG.API.UNIVERSITIES),fetchAppJSON(CONFIG.API.RESIDENCES),fetchAppJSON(CONFIG.getUrl('data/ecoles.json'))]);
  (u?.universities||[]).forEach(x=>x.coordinates&&addPlace(x.name,'جامعة',x.coordinates.lat,x.coordinates.lng,x.wilaya,x.officialUrl));
  (r?.residences||[]).forEach(x=>x.coordinates&&addPlace(x.name,'إقامة',x.coordinates.lat,x.coordinates.lng,x.wilaya));
  (Array.isArray(e)?e:[]).forEach(x=>{const p=x.position||x.coordinates;if(p)addPlace(x.name,'مدرسة / معهد',p.lat,p.lng,x.wilaya,x.officialUrl)});
 }catch(err){console.error('Map data loading failed:',err)}
 search.addEventListener('input',renderResults);
 search.addEventListener('keydown',e=>{if(e.key==='Escape'){results.style.display='none';search.setAttribute('aria-expanded','false')}});
 results.addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(!b)return;const p=places[Number(b.dataset.index)];if(!p)return;map.setView([p.lat,p.lng],16);const m=markers.find(x=>{const ll=x.getLatLng();return ll.lat===p.lat&&ll.lng===p.lng});if(m)m.openPopup();search.value=p.name;results.style.display='none';search.setAttribute('aria-expanded','false')});
 categoryButtons.forEach(button=>button.addEventListener('click',()=>{activeCategory=button.dataset.category;categoryButtons.forEach(b=>b.classList.toggle('active',b===button));clear();filteredPlaces().forEach(p=>{const content=`${p.extra||''}${p.url?`<br><a href="${p.url}" target="_blank" rel="noopener">الموقع الرسمي</a>`:''}<br>${route(p.lat,p.lng)}`;const marker=addMarker(p.lat,p.lng,`${p.type}: ${p.name}`,content,p.type==='جامعة'?'university':p.type==='إقامة'?'residence':'ecole');if(marker)markers.push(marker)});renderResults() }));
 document.addEventListener('click',e=>{if(!e.target.closest('.map-search')){results.style.display='none';search.setAttribute('aria-expanded','false')}});
 document.getElementById('clearMapBtn').addEventListener('click',()=>{clear();places=[];search.value='';results.style.display='none';search.setAttribute('aria-expanded','false')});
 document.getElementById('btnNearMe').addEventListener('click',()=>{if(!navigator.geolocation)return alert('المتصفح لا يدعم تحديد الموقع.');navigator.geolocation.getCurrentPosition(p=>{userLocation={lat:p.coords.latitude,lng:p.coords.longitude};map.setView([userLocation.lat,userLocation.lng],14);addMarker(userLocation.lat,userLocation.lng,'موقعك الحالي','','default').openPopup()},()=>alert('تعذر تحديد موقعك. يرجى السماح بالوصول إلى الموقع.'))});
 document.getElementById('currentYear').textContent=new Date().getFullYear();
 if(window.StorageApp?.addRecent)StorageApp.addRecent({id:'maps',title:'الخرائط',url:'tools/maps.html',icon:'🗺️'});
});
</script>
</body>
</html>
