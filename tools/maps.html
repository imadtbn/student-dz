<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>خريطة الطالب - Student DZ</title><meta name="theme-color" content="#007A5E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/main.css"><script src="../assets/js/config.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="icon" href="../assets/images/icon.png"><style>.map-container{width:100%;height:65vh;border-radius:var(--radius-lg);margin:20px 0;z-index:1}.map-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.map-search{grid-column:1/-1;position:relative}.map-search input{width:100%;padding:13px 45px 13px 15px;border:1px solid var(--border-color);border-radius:30px;background:var(--bg-card);color:var(--text-main);font:inherit}.map-search i{position:absolute;right:17px;top:15px;color:var(--text-muted)}.map-results{position:absolute;left:0;right:0;top:55px;z-index:2000;max-height:300px;overflow:auto;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;box-shadow:var(--shadow-lg);display:none}.map-result{display:block;padding:11px 14px;border-bottom:1px solid var(--border-color);color:var(--text-main);cursor:pointer}.map-result:hover{background:var(--bg-main)}.map-result small{display:block;color:var(--text-muted)}@media(max-width:600px){.map-tools{grid-template-columns:1fr}.map-container{height:62vh}}</style></head><body><header class="site-header"><div class="container"><a href="../index.html" class="logo"><img src="../assets/images/icon.png" alt="Student DZ" width="32" height="32" style="border-radius:8px"> Student DZ</a><nav class="main-nav" id="mainNav"><a href="../index.html" class="nav-link">الرئيسية</a><a href="../universities/index.html" class="nav-link">الجامعات</a><a href="../ecoles/index.html" class="nav-link">المدارس والمعاهد</a><a href="../residences/index.html" class="nav-link">الإقامات</a><a href="../transport/index.html" class="nav-link">النقل</a><a href="../tools/maps.html" class="nav-link">الخريطة</a><a href="../categories/tools.html" class="nav-link">الأدوات</a><a href="../categories/student-life.html" class="nav-link">الحياة الجامعية</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="تبديل الوضع"><i class="fa-solid fa-moon"></i></button><button class="hamburger" id="menuToggle" type="button" aria-label="القائمة" aria-expanded="false" aria-controls="mainNav">☰</button></div></div></header><main class="container"><h1 class="section-title"><i class="fa-solid fa-map-location-dot"></i> خريطة الطالب</h1><div class="map-tools"><div class="map-search"><i class="fa-solid fa-magnifying-glass"></i><input id="mapSearch" type="search" autocomplete="off" placeholder="ابحث في الجامعات، المدارس والمعاهد، الإقامات..."><div id="mapResults" class="map-results"></div></div><button class="btn btn-outline" id="btnNearMe"><i class="fa-solid fa-location-crosshairs"></i> موقعي</button><button class="btn btn-outline" id="clearMapBtn"><i class="fa-solid fa-eraser"></i> محو العلامات</button></div><div id="map" class="map-container"></div></main><footer class="site-footer"><div class="container"><div class="footer-bottom">&copy; <span id="currentYear"></span> Student DZ. جميع الحقوق محفوظة.</div></div></footer><script src="../assets/js/app.js"></script><script src="../assets/js/maps.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/js/theme.js"></script><script src="../assets/js/navigation.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{let userLocation=null,markers=[],places=[];const map=await initMap('map',36.7538,3.0588,12);const search=document.getElementById('mapSearch'),results=document.getElementById('mapResults');function route(lat,lng){let u=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;if(userLocation)u+=`&origin=${userLocation.lat},${userLocation.lng}`;return `<a href="${u}" target="_blank" rel="noopener">فتح المسار</a>`}function clear(){markers.forEach(m=>map&&map.removeLayer(m));markers=[]}function addPlace(name,type,lat,lng,extra,url){if(!Number.isFinite(Number(lat))||!Number.isFinite(Number(lng)))return;const place={name,type,lat:Number(lat),lng:Number(lng),extra:extra||'',url:url||''};places.push(place);const content=`${extra||''}${url?`<br><a href="${url}" target="_blank" rel="noopener">الموقع الرسمي</a>`:''}<br>${route(place.lat,place.lng)}`;const marker=addMarker(place.lat,place.lng,`${type}: ${name}`,content,type==='جامعة'?'university':type==='إقامة'?'residence':'ecole');if(marker)markers.push(marker)}try{const [u,r,e]=await Promise.all([fetchAppJSON(CONFIG.API.UNIVERSITIES),fetchAppJSON(CONFIG.API.RESIDENCES),fetchAppJSON(CONFIG.getUrl('data/ecoles.json'))]);(u?.universities||[]).forEach(x=>x.coordinates&&addPlace(x.name,'جامعة',x.coordinates.lat,x.coordinates.lng,x.wilaya,x.officialUrl));(r?.residences||[]).forEach(x=>x.coordinates&&addPlace(x.name,'إقامة',x.coordinates.lat,x.coordinates.lng,x.wilaya));(Array.isArray(e)?e:[]).forEach(x=>{const p=x.position||x.coordinates;if(p)addPlace(x.name,'مدرسة / معهد',p.lat,p.lng,x.wilaya,x.officialUrl)});}catch(err){console.error('Map data loading failed:',err)}search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();if(q.length<2){results.style.display='none';return}const matches=places.filter(p=>`${p.name} ${p.type} ${p.extra}`.toLowerCase().includes(q)).slice(0,10);results.innerHTML=matches.length?matches.map((p,i)=>`<button class="map-result" data-index="${places.indexOf(p)}"><strong>${p.name}</strong><small>${p.type}${p.extra?' • '+p.extra:''}</small></button>`).join(''):'<div class="map-result">لا توجد نتائج</div>';results.style.display='block'});results.addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(!b)return;const p=places[Number(b.dataset.index)];map.setView([p.lat,p.lng],16);const m=markers.find(x=>{const ll=x.getLatLng();return ll.lat===p.lat&&ll.lng===p.lng});if(m)m.openPopup();search.value=p.name;results.style.display='none'});document.addEventListener('click',e=>{if(!e.target.closest('.map-search'))results.style.display='none'});document.getElementById('clearMapBtn').addEventListener('click',()=>{clear();places=[];search.value='';results.style.display='none';});document.getElementById('btnNearMe').addEventListener('click',()=>{if(!navigator.geolocation)return alert('المتصفح لا يدعم تحديد الموقع.');navigator.geolocation.getCurrentPosition(p=>{userLocation={lat:p.coords.latitude,lng:p.coords.longitude};map.setView([userLocation.lat,userLocation.lng],14);addMarker(userLocation.lat,userLocation.lng,'موقعك الحالي','', 'default').openPopup()},()=>alert('تعذر تحديد موقعك. يرجى السماح بالوصول إلى الموقع.'))});document.getElementById('currentYear').textContent=new Date().getFullYear();StorageApp.addRecent({id:'maps',title:'الخرائط',url:'tools/maps.html',icon:'🗺️'});});</script></body></html>
