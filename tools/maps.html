<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخريطة الجامعية - Student DZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="../assets/js/config.js"></script>
    <style>
        .map-container {
            width: 100%;
            height: 60vh;
            border-radius: var(--radius-lg);
            margin: 20px 0;
            z-index: 1; /* Keep map below header */
        }
        .map-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-graduation-cap"></i> Student DZ
            </a>

            <nav class="main-nav" id="mainNav">
                <a href="../index.html" class="nav-link">الرئيسية</a>
                <a href="../categories/tools.html" class="nav-link">الأدوات</a>
                <a href="../universities/index.html" class="nav-link">الجامعات</a>
                <a href="../ecoles/index.html" class="nav-link">المدارس العليا</a>
                <a href="../platforms/index.html" class="nav-link">المنصات</a>
                <a href="../residences/index.html" class="nav-link">الإقامات</a>
            </nav>

            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" aria-label="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
                <button class="hamburger" id="menuToggle" aria-label="القائمة">☰</button>
            </div>
        </div>
    </header>

    <main class="container">
        <h1 class="section-title" style="margin-top:2rem;">الخريطة الجامعية (مرحلة تجريبية)</h1>

        <div class="map-controls">
            <button class="btn" id="loadMapBtn">تحميل الخريطة</button>
            <button class="btn btn-outline" id="btnNearMe" disabled><i class="fa-solid fa-location-crosshairs"></i> موقعي</button>
            <button class="btn btn-outline" id="loadUnivBtn" disabled>عرض الجامعات</button>
            <button class="btn btn-outline" id="loadResBtn" disabled>عرض الإقامات</button>
            <button class="btn btn-outline" id="loadEcolesBtn" disabled>عرض المدارس</button>
        </div>

        <div id="map" class="map-container" style="display:none; background:#eee;"></div>
    </main>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/maps.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script>
        StorageApp.addRecent({ id: 'maps', title: 'الخرائط', url: 'tools/maps.html', icon: '🗺️' });

        const loadMapBtn = document.getElementById('loadMapBtn');
        const loadUnivBtn = document.getElementById('loadUnivBtn');
        const loadResBtn = document.getElementById('loadResBtn');
        const loadEcolesBtn = document.getElementById('loadEcolesBtn');
        const btnNearMe = document.getElementById('btnNearMe');
        const mapDiv = document.getElementById('map');

        let userLocation = null;
        let markers = []; // keep track of markers to avoid duplicates if clicked multiple times

        function getRouteLink(lat, lng) {
            let baseUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
            if (userLocation) {
                baseUrl += `&origin=${userLocation.lat},${userLocation.lng}`;
            }
            return `<br><a href="${baseUrl}" target="_blank" class="btn btn-outline" style="display:inline-block; margin-top:10px; padding: 5px 10px; text-decoration:none;"><i class="fa-solid fa-route"></i> مسار نحو الوجهة</a>`;
        }

        loadMapBtn.addEventListener('click', async () => {
            loadMapBtn.textContent = 'جاري التحميل...';
            loadMapBtn.disabled = true;
            mapDiv.style.display = 'block';

            await initMap('map', 36.7538, 3.0588, 12); // Centered on Algiers

            loadMapBtn.style.display = 'none';
            loadUnivBtn.disabled = false;
            loadResBtn.disabled = false;
            loadEcolesBtn.disabled = false;
            btnNearMe.disabled = false;
        });

        btnNearMe.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('المتصفح لا يدعم تحديد الموقع.');
                return;
            }

            btnNearMe.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> تحديد...';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    userLocation = { lat, lng };

                    if (mapInstance) {
                        mapInstance.setView([lat, lng], 13);
                        // Using a red icon for user location
                        L.circleMarker([lat, lng], {
                            color: 'red',
                            fillColor: '#f03',
                            fillOpacity: 0.5,
                            radius: 8
                        }).addTo(mapInstance).bindPopup("<b>موقعك الحالي</b>").openPopup();
                    }

                    btnNearMe.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> موقعي';
                    btnNearMe.classList.add('active');
                },
                (error) => {
                    alert('تعذر تحديد موقعك. يرجى تفعيل الصلاحية.');
                    btnNearMe.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> موقعي';
                }
            );
        });

        loadUnivBtn.addEventListener('click', async () => {
            const data = await fetchAppJSON(CONFIG.API.UNIVERSITIES);
            if(data && data.universities) {
                data.universities.forEach(u => {
                    if(u.coordinates) {
                        const content = `<a href="${u.officialUrl}" target="_blank">الموقع الرسمي</a>` + getRouteLink(u.coordinates.lat, u.coordinates.lng);
                        addMarker(u.coordinates.lat, u.coordinates.lng, "🎓 " + u.name, content);
                    }
                });
            }
        });

        loadResBtn.addEventListener('click', async () => {
            const data = await fetchAppJSON(CONFIG.API.RESIDENCES);
            if(data && data.residences) {
                data.residences.forEach(r => {
                    if(r.coordinates) {
                        const content = `الولاية: ${r.wilaya}` + getRouteLink(r.coordinates.lat, r.coordinates.lng);
                        addMarker(r.coordinates.lat, r.coordinates.lng, "🏢 " + r.name, content);
                    }
                });
            }
        });

        loadEcolesBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(CONFIG.getUrl('data/ecoles.json'));
                if (response.ok) {
                    const data = await response.json();
                    data.forEach(e => {
                        if(e.position) {
                            const content = `<a href="${e.officialUrl}" target="_blank">الموقع الرسمي</a><br>الولاية: ${e.wilaya}` + getRouteLink(e.position.lat, e.position.lng);
                            addMarker(e.position.lat, e.position.lng, "🏫 " + e.name, content);
                        }
                    });
                }
            } catch (err) {
                console.error('Failed to load ecoles data', err);
            }
        });
    </script>
</body>
</html>
