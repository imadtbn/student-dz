<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ضغط الصور - Student DZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="../assets/js/config.js"></script>
    <style>
        .tool-container {
            max-width: 600px;
            margin: 2rem auto;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            text-align: center;
        }
        .preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px 0;
            display: none;
        }
        .controls {
            margin: 20px 0;
            display: none;
        }
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i> Student DZ</a>
        </div>
    </header>

    <main class="container">
        <div class="tool-container">
            <h1 class="section-title">ضغط الصور محلياً</h1>
            <p>صغّر حجم الصور لرفعها على المنصات الجامعية دون فقدان كبير للجودة.</p>

            <input type="file" id="imgInput" accept="image/jpeg, image/png, image/webp" style="margin-bottom: 20px;">

            <img id="previewImg" class="preview">

            <div id="controls" class="controls">
                <label>الجودة: <span id="qualityVal">0.8</span></label>
                <input type="range" id="quality" min="0.1" max="1" step="0.1" value="0.8">
                <button class="btn" id="downloadBtn">تحميل الصورة المضغوطة</button>
            </div>
        </div>
    </main>

    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script>
        StorageApp.addRecent({ id: 'img-comp', title: 'ضغط الصور', url: 'tools/image-compressor.html', icon: '🖼️' });

        const imgInput = document.getElementById('imgInput');
        const previewImg = document.getElementById('previewImg');
        const controls = document.getElementById('controls');
        const qualitySlider = document.getElementById('quality');
        const qualityVal = document.getElementById('qualityVal');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalImage = null;

        imgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    previewImg.src = event.target.result;
                    previewImg.style.display = 'block';
                    controls.style.display = 'block';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        qualitySlider.addEventListener('input', (e) => {
            qualityVal.textContent = e.target.value;
        });

        downloadBtn.addEventListener('click', () => {
            if(!originalImage) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            ctx.drawImage(originalImage, 0, 0);

            const q = parseFloat(qualitySlider.value);
            const dataUrl = canvas.toDataURL('image/jpeg', q);

            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'compressed_studentdz.jpg';
            a.click();
        });
    </script>
</body>
</html>
