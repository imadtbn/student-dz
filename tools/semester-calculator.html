<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة المعدل السنوي - Student DZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="../assets/js/config.js"></script>
    <style>
        .tool-container {
            max-width: 600px;
            margin: 2rem auto;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: var(--font-family);
        }
        .result-box {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--primary-light);
            color: white;
            border-radius: var(--radius-md);
            font-size: 1.5rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-graduation-cap"></i> Student DZ
            </a>

            <nav class="main-nav" id="mainNav">
                <a href="../index.html" class="nav-link">الرئيسية</a>
                <a href="../categories/tools.html" class="nav-link">الأدوات</a>
                <a href="../universities/index.html" class="nav-link">الجامعات</a>
                <a href="../ecoles/index.html" class="nav-link">المدارس العليا</a>
                <a href="../platforms/index.html" class="nav-link">المنصات</a>
                <a href="../residences/index.html" class="nav-link">الإقامات</a>
            </nav>

            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" aria-label="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
                <button class="hamburger" id="menuToggle" aria-label="القائمة">☰</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-container">
            <h1 class="section-title">حاسبة المعدل السنوي</h1>

            <label style="display:block; text-align:right; margin-bottom:5px;">معدل الفصل الأول</label>
            <input type="number" id="s1" placeholder="مثال: 12.50" min="0" max="20" step="0.01">

            <label style="display:block; text-align:right; margin-bottom:5px;">معدل الفصل الثاني</label>
            <input type="number" id="s2" placeholder="مثال: 13.00" min="0" max="20" step="0.01">

            <label style="display:block; text-align:right; margin-bottom:5px;">معدل الفصل الثالث</label>
            <input type="number" id="s3" placeholder="مثال: 14.00" min="0" max="20" step="0.01">

            <button class="btn" id="calcBtn" style="width:100%;">احسب المعدل السنوي</button>

            <div id="result" class="result-box"></div>
        </div>
    </main>
    <script src="../assets/js/storage.js"></script>
    <script>
        StorageApp.addRecent({ id: 'sem-calc', title: 'المعدل السنوي', url: 'tools/semester-calculator.html', icon: 'fa-solid fa-chart-bar' });

        document.getElementById('calcBtn').addEventListener('click', () => {
            const s1 = parseFloat(document.getElementById('s1').value);
            const s2 = parseFloat(document.getElementById('s2').value);
            const s3 = parseFloat(document.getElementById('s3').value);
            const res = document.getElementById('result');

            if(!isNaN(s1) && !isNaN(s2) && !isNaN(s3)) {
                const avg = ((s1 + s2 + s3) / 3).toFixed(2);
                res.textContent = `المعدل السنوي: ${avg}`;
                res.style.display = 'block';
                res.style.backgroundColor = avg >= 10 ? 'var(--primary-color)' : 'var(--secondary-color)';
            } else {
                 res.textContent = 'الرجاء إدخال معدلات صالحة في جميع الفصول.';
                 res.style.display = 'block';
                 res.style.backgroundColor = 'var(--secondary-color)';
            }
        });
    </script>
</body>
</html>
