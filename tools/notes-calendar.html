<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الملاحظات والمواعيد والمهام - Student DZ</title>
    <meta name="description" content="سجل رقمي للطالب الجزائري لتدوين الملاحظات والمواعيد والمهام مع التاريخ والوقت والتذكير والتقويم، مع حفظ البيانات محلياً في المتصفح.">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://imadtbn.github.io/student-dz/tools/notes-calendar.html">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../assets/images/icon.png">
    <style>
        .planner{max-width:1100px;margin:2rem auto}.planner-card{background:var(--bg-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:1.4rem;margin-bottom:1rem}
        .planner-form{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700}.field input,.field select,.field textarea{padding:11px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-main);color:var(--text-main);font-family:var(--font-family);width:100%;box-sizing:border-box}.field textarea{min-height:80px;resize:vertical}.field.full{grid-column:1/-1}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btn.danger{background:#dc3545;border-color:#dc3545}.btn.small{padding:.45rem .7rem;font-size:.9rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:1rem;border:1px solid var(--border-color);border-radius:var(--radius-md);text-align:center;background:var(--bg-main)}.stat strong{display:block;font-size:1.4rem}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}.entries{display:grid;gap:10px}.entry{border:1px solid var(--border-color);border-right:5px solid var(--primary-color);border-radius:var(--radius-md);padding:1rem;background:var(--bg-main)}.entry.type-appointment{border-right-color:#0d6efd}.entry.type-task{border-right-color:#198754}.entry.done{opacity:.65}.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.entry-title{font-size:1.05rem;font-weight:800}.entry-meta{color:var(--text-muted);font-size:.9rem;margin:.4rem 0}.entry-note{white-space:pre-wrap;line-height:1.7}.entry-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:.8rem}.badge{display:inline-block;padding:.25rem .55rem;border-radius:999px;background:var(--primary-light);color:#fff;font-size:.78rem}.badge.appointment{background:#0d6efd}.badge.task{background:#198754}.badge.note{background:#6f42c1}.overdue{color:#dc3545;font-weight:700}.soon{color:#d97706;font-weight:700}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-day-name{text-align:center;font-weight:800;padding:.5rem;color:var(--text-muted)}.cal-cell{min-height:95px;border:1px solid var(--border-color);border-radius:8px;padding:6px;background:var(--bg-main);cursor:pointer}.cal-cell.muted{opacity:.4}.cal-cell.today{outline:2px solid var(--primary-color)}.cal-num{font-weight:800}.cal-item{font-size:.74rem;padding:3px 4px;margin-top:4px;border-radius:5px;background:var(--primary-light);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{text-align:center;padding:1.5rem;color:var(--text-muted)}.notice{display:none;padding:.8rem 1rem;border-radius:var(--radius-md);background:var(--bg-main);border:1px solid var(--border-color);margin-bottom:1rem}.notice.show{display:block}
        @media(max-width:800px){.planner-form{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.calendar-grid{gap:3px}.cal-cell{min-height:78px;padding:4px}.cal-item{font-size:.68rem}}
        @media(max-width:500px){.planner{margin:1rem auto}.planner-card{padding:1rem}.planner-form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.entry-top{flex-direction:column}.calendar-head{align-items:flex-start}.cal-day-name{font-size:.75rem}.cal-cell{min-height:68px}.cal-item{display:none}}
    </style>
</head>
<body>
<header class="site-header">
    <div class="container">
        <a href="../index.html" class="logo"><img src="../assets/images/icon.png" alt="Student DZ" width="32" height="32"> Student DZ</a>
        <nav class="main-nav" id="mainNav">
            <a href="../index.html" class="nav-link">الرئيسية</a><a href="../universities/index.html" class="nav-link">الجامعات</a><a href="../ecoles/index.html" class="nav-link">المدارس والمعاهد</a><a href="../residences/index.html" class="nav-link">الإقامات</a><a href="../transport/index.html" class="nav-link">النقل</a><a href="../tools/maps.html" class="nav-link">الخريطة</a><a href="../categories/tools.html" class="nav-link">الأدوات</a><a href="../categories/student-life.html" class="nav-link">الحياة الجامعية</a>
        </nav>
        <div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="تبديل الوضع"><i class="fa-solid fa-moon"></i></button><button class="hamburger" id="menuToggle" aria-label="القائمة">☰</button></div>
    </div>
</header>
<main class="container planner">
    <h1 class="section-title" style="margin-top:2rem;"><i class="fa-solid fa-calendar-check"></i> سجل الملاحظات والمواعيد والمهام</h1>
    <p style="text-align:center;color:var(--text-muted)">نظّم دراستك ومواعيدك ومهامك، واحفظها على جهازك مباشرة دون حساب.</p>

    <div id="notice" class="notice" role="status"></div>

    <section class="planner-card">
        <h2 id="formTitle"><i class="fa-solid fa-plus"></i> إضافة سجل جديد</h2>
        <form id="entryForm">
            <div class="planner-form">
                <div class="field"><label for="title">العنوان</label><input id="title" required maxlength="120" placeholder="مثال: مراجعة الرياضيات"></div>
                <div class="field"><label for="type">النوع</label><select id="type"><option value="note">ملاحظة</option><option value="appointment">موعد</option><option value="task">مهمة</option></select></div>
                <div class="field"><label for="date">التاريخ</label><input id="date" type="date" required></div>
                <div class="field"><label for="time">الساعة</label><input id="time" type="time" required></div>
                <div class="field"><label for="reminder">التذكير</label><select id="reminder"><option value="0">عند الموعد</option><option value="5">قبل 5 دقائق</option><option value="15" selected>قبل 15 دقيقة</option><option value="30">قبل 30 دقيقة</option><option value="60">قبل ساعة</option><option value="1440">قبل يوم</option></select></div>
                <div class="field full"><label for="details">تفاصيل / ملاحظة إضافية</label><textarea id="details" maxlength="1000" placeholder="اكتب التفاصيل التي تريد تذكرها..."></textarea></div>
            </div>
            <div class="form-actions"><button class="btn" type="submit" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> حفظ</button><button class="btn btn-outline" type="button" id="cancelBtn" hidden>إلغاء التعديل</button><button class="btn btn-outline" type="button" id="notifyBtn"><i class="fa-solid fa-bell"></i> تفعيل إشعارات المتصفح</button></div>
        </form>
    </section>

    <section class="planner-card"><div class="stats"><div class="stat"><strong id="totalCount">0</strong><span>الإجمالي</span></div><div class="stat"><strong id="todayCount">0</strong><span>اليوم</span></div><div class="stat"><strong id="taskCount">0</strong><span>المهام</span></div><div class="stat"><strong id="upcomingCount">0</strong><span>القادمة</span></div></div></section>

    <section class="planner-card">
        <div class="toolbar"><h2><i class="fa-solid fa-list-check"></i> سجلي</h2><div class="toolbar-actions"><select id="filterType" aria-label="تصفية النوع"><option value="all">كل السجلات</option><option value="note">ملاحظات</option><option value="appointment">مواعيد</option><option value="task">مهام</option></select><button class="btn small" id="clearDone" type="button">حذف المكتمل</button></div></div>
        <div id="entries" class="entries"></div>
    </section>

    <section class="planner-card">
        <div class="calendar-head"><button class="btn btn-outline small" id="prevMonth" type="button"><i class="fa-solid fa-chevron-right"></i></button><h2 id="monthTitle"></h2><button class="btn btn-outline small" id="nextMonth" type="button"><i class="fa-solid fa-chevron-left"></i></button></div>
        <div id="calendar" class="calendar-grid"></div>
    </section>
</main>
<footer class="site-footer"><div class="container"><div class="footer-bottom">&copy; <span id="currentYear"></span> Student DZ. جميع الحقوق محفوظة.</div></div></footer>
<script src="../assets/js/theme.js"></script><script src="../assets/js/navigation.js"></script>
<script>
(function(){
    'use strict';
    const KEY='studentDzPlannerEntries'; let entries=load(); let editingId=null; let viewDate=new Date(); viewDate.setDate(1);
    const $=id=>document.getElementById(id); const form=$('entryForm'); const notice=$('notice');
    const labels={note:'ملاحظة',appointment:'موعد',task:'مهمة'};
    function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
    function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
    function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function localDateTime(e){return new Date(e.date+'T'+e.time+':00')}
    function fmtDate(e){return new Intl.DateTimeFormat('ar-DZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(localDateTime(e))}
    function msg(text){notice.textContent=text;notice.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>notice.classList.remove('show'),3500)}
    function resetForm(){editingId=null;form.reset();$('date').value=new Date().toISOString().slice(0,10);$('time').value='18:00';$('reminder').value='15';$('formTitle').innerHTML='<i class="fa-solid fa-plus"></i> إضافة سجل جديد';$('saveBtn').innerHTML='<i class="fa-solid fa-floppy-disk"></i> حفظ';$('cancelBtn').hidden=true}
    function render(){
        const filter=$('filterType').value, now=new Date(); let list=entries.filter(e=>filter==='all'||e.type===filter).sort((a,b)=>localDateTime(a)-localDateTime(b));
        $('entries').innerHTML=list.length?list.map(e=>{const dt=localDateTime(e), diff=dt-now, state=e.type==='task'&&e.done?'done':(diff<0?'overdue':diff<=86400000?'soon':'');return `<article class="entry type-${e.type} ${state}"><div class="entry-top"><div><span class="badge ${e.type}">${labels[e.type]}</span><div class="entry-title">${esc(e.title)}</div><div class="entry-meta"><i class="fa-regular fa-calendar"></i> ${esc(fmtDate(e))} &nbsp; <i class="fa-regular fa-clock"></i> ${esc(e.time)} &nbsp; <i class="fa-regular fa-bell"></i> ${e.reminder==0?'عند الموعد':'قبل '+esc(e.reminder)+' دقيقة'}</div></div>${e.type==='task'?`<button class="btn small ${e.done?'':'btn-outline'}" data-action="done" data-id="${e.id}">${e.done?'مكتملة':'إتمام المهمة'}</button>`:''}</div>${e.details?`<div class="entry-note">${esc(e.details)}</div>`:''}<div class="entry-actions"><button class="btn small btn-outline" data-action="edit" data-id="${e.id}"><i class="fa-solid fa-pen"></i> تعديل</button><button class="btn small danger" data-action="delete" data-id="${e.id}"><i class="fa-solid fa-trash"></i> حذف</button></div></article>`}).join(''):'<div class="empty">لا توجد سجلات حالياً. أضف أول ملاحظة أو موعد أو مهمة.</div>';
        const today=new Date().toISOString().slice(0,10);$('totalCount').textContent=entries.length;$('todayCount').textContent=entries.filter(e=>e.date===today).length;$('taskCount').textContent=entries.filter(e=>e.type==='task'&&!e.done).length;$('upcomingCount').textContent=entries.filter(e=>localDateTime(e)>=now).length;renderCalendar()
    }
    form.addEventListener('submit',e=>{e.preventDefault();const data={id:editingId||Date.now().toString(),title:$('title').value.trim(),type:$('type').value,date:$('date').value,time:$('time').value,reminder:Number($('reminder').value),details:$('details').value.trim(),done:editingId?(entries.find(x=>x.id===editingId)?.done||false):false};if(!data.title||!data.date||!data.time)return;const old=entries.findIndex(x=>x.id===data.id);if(old>-1)entries[old]=data;else entries.push(data);save();resetForm();render();msg(old>-1?'تم تحديث السجل بنجاح.':'تم حفظ السجل في المتصفح.')});
    $('entries').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id, action=b.dataset.action, item=entries.find(x=>x.id===id);if(!item)return;if(action==='delete'){if(confirm('هل تريد حذف هذا السجل؟')){entries=entries.filter(x=>x.id!==id);save();if(editingId===id)resetForm();render();msg('تم حذف السجل.')}}else if(action==='edit'){$('title').value=item.title;$('type').value=item.type;$('date').value=item.date;$('time').value=item.time;$('reminder').value=item.reminder;$('details').value=item.details||'';editingId=id;$('formTitle').innerHTML='<i class="fa-solid fa-pen"></i> تعديل السجل';$('saveBtn').innerHTML='<i class="fa-solid fa-floppy-disk"></i> حفظ التعديل';$('cancelBtn').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}else if(action==='done'){item.done=!item.done;save();render()}});
    $('cancelBtn').onclick=resetForm;$('filterType').onchange=render;$('clearDone').onclick=()=>{const before=entries.length;entries=entries.filter(e=>!(e.type==='task'&&e.done));if(entries.length!==before){save();render();msg('تم حذف المهام المكتملة.')}};
    $('notifyBtn').onclick=async()=>{if(!('Notification'in window)){msg('هذا المتصفح لا يدعم إشعارات سطح المكتب.');return}const p=await Notification.requestPermission();msg(p==='granted'?'تم تفعيل إشعارات التذكير.':'لم يتم تفعيل الإشعارات.')};
    function renderCalendar(){const y=viewDate.getFullYear(),m=viewDate.getMonth();$('monthTitle').textContent=new Intl.DateTimeFormat('ar-DZ',{month:'long',year:'numeric'}).format(viewDate);const names=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let html=names.map(n=>`<div class="cal-day-name">${n}</div>`).join('');const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();for(let i=0;i<42;i++){const d=i-first+1;let day=d,mm=m,yy=y,muted=false;if(d<1){day=prevDays+d;mm=m-1;muted=true}else if(d>days){day=d-days;mm=m+1;muted=true}const ds=`${yy}-${String(mm+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`, isToday=ds===new Date().toISOString().slice(0,10);const items=entries.filter(e=>e.date===ds).sort((a,b)=>a.time.localeCompare(b.time));html+=`<div class="cal-cell ${muted?'muted':''} ${isToday?'today':''}" data-date="${ds}"><div class="cal-num">${day}</div>${items.slice(0,3).map(e=>`<div class="cal-item" title="${esc(e.title)}">${esc(e.time)} ${esc(e.title)}</div>`).join('')}${items.length>3?`<div class="cal-item">+${items.length-3} أخرى</div>`:''}</div>`}$('calendar').innerHTML=html}
    $('prevMonth').onclick=()=>{viewDate.setMonth(viewDate.getMonth()-1);renderCalendar()};$('nextMonth').onclick=()=>{viewDate.setMonth(viewDate.getMonth()+1);renderCalendar()};
    $('calendar').addEventListener('click',e=>{const c=e.target.closest('.cal-cell');if(!c)return;$('date').value=c.dataset.date;window.scrollTo({top:0,behavior:'smooth'});$('title').focus()});
    function checkReminders(){const now=Date.now();entries.forEach(e=>{if(e.type==='task'&&e.done)return;const due=localDateTime(e).getTime()-Number(e.reminder)*60000;if(Math.abs(due-now)<=30000){const stamp=e.id+'-'+e.date+'-'+e.time+'-'+e.reminder;if(sessionStorage.getItem('reminded:'+stamp))return;sessionStorage.setItem('reminded:'+stamp,'1');msg('تذكير: '+e.title+' — '+e.time);if('Notification'in window&&Notification.permission==='granted')new Notification('Student DZ — تذكير',{body:e.title+'\n'+e.time,icon:'../assets/images/icon.png'})}})}
    resetForm();render();checkReminders();setInterval(checkReminders,30000);setInterval(render,60000);$('currentYear').textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
