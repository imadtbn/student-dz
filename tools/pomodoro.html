<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤقت بومودورو - Student DZ</title>
    <meta name="description" content="مؤقت بومودورو لتنظيم وقت الدراسة.">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="../assets/js/config.js"></script>
    <style>
        .timer-container {
            max-width: 500px;
            margin: 4rem auto;
            text-align: center;
            background: var(--bg-card);
            padding: 3rem;
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .time-display {
            font-size: 6rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 2rem 0;
            font-family: monospace;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .mode-btn {
            background: transparent;
            border: 2px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
        }
        .mode-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(0, 122, 94, 0.1);
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">🎓 Student DZ</a>
        </div>
    </header>

    <main class="container">
        <div class="timer-container">
            <h1 class="section-title">مؤقت الدراسة</h1>

            <div class="mode-selector">
                <button class="mode-btn active" data-time="25">دراسة (25 د)</button>
                <button class="mode-btn" data-time="5">استراحة قصيرة (5 د)</button>
                <button class="mode-btn" data-time="15">استراحة طويلة (15 د)</button>
            </div>

            <div class="time-display" id="timeDisplay">25:00</div>

            <div class="controls">
                <button class="btn" id="startBtn">ابدأ</button>
                <button class="btn btn-outline" id="resetBtn">إعادة ضبط</button>
            </div>
        </div>
    </main>

    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script>
        StorageApp.addRecent({ id: 'pomodoro', title: 'مؤقت بومودورو', url: 'tools/pomodoro.html', icon: '⏱️' });

        let timer;
        let timeLeft = 25 * 60;
        let isRunning = false;

        const display = document.getElementById('timeDisplay');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const modeBtns = document.querySelectorAll('.mode-btn');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            display.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.title = `${display.textContent} - بومودورو`;
        }

        function switchMode(minutes, btn) {
            clearInterval(timer);
            isRunning = false;
            startBtn.textContent = 'ابدأ';
            timeLeft = minutes * 60;
            updateDisplay();

            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                switchMode(parseInt(btn.dataset.time), btn);
            });
        });

        startBtn.addEventListener('click', () => {
            if(isRunning) {
                clearInterval(timer);
                startBtn.textContent = 'استئناف';
            } else {
                timer = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if(timeLeft <= 0) {
                        clearInterval(timer);
                        isRunning = false;
                        startBtn.textContent = 'ابدأ';
                        alert('انتهى الوقت!'); // Could be replaced with a sound in a real app
                    }
                }, 1000);
                startBtn.textContent = 'إيقاف';
            }
            isRunning = !isRunning;
        });

        resetBtn.addEventListener('click', () => {
            const activeBtn = document.querySelector('.mode-btn.active');
            switchMode(parseInt(activeBtn.dataset.time), activeBtn);
        });

        updateDisplay();
    </script>
</body>
</html>
