<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>مولد جدول الدراسة - Student DZ</title>
    <meta name="description" content="أنشئ جدول دراسة أسبوعي منظم حسب المواد والأيام والأوقات.">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="../assets/images/icon.png">
    <style>
        .tool-container {
            max-width: 900px;
            margin: 2rem auto;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md)
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .input-group label {
            font-weight: 700
        }

        .input-group input,
        .input-group select {
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-family)
        }

        .schedule {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 22px
        }

        .day {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px;
            min-height: 120px
        }

        .day h3 {
            text-align: center;
            margin-bottom: 8px
        }

        .lesson {
            padding: 8px;
            background: var(--primary-light);
            color: white;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: .9rem
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px
        }

        @media(max-width:800px) {

            .form-grid,
            .schedule {
                grid-template-columns: 1fr 1fr
            }
        }

        @media(max-width:500px) {
            .schedule {
                grid-template-columns: 1fr
            }

            .tool-container {
                padding: 1rem
            }

            .actions {
                flex-direction: column
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container"><a href="../index.html" class="logo"><img src="../assets/images/icon.png"
                    alt="Student DZ" width="32" height="32"> Student DZ</a>
            <nav class="main-nav" id="mainNav"><a href="../index.html" class="nav-link">الرئيسية</a><a
                    href="../universities/index.html" class="nav-link">الجامعات</a><a href="../ecoles/index.html"
                    class="nav-link">المدارس والمعاهد</a><a href="../residences/index.html"
                    class="nav-link">الإقامات</a><a href="../transport/index.html" class="nav-link">النقل</a><a
                    href="../tools/maps.html" class="nav-link">الخريطة</a><a href="../categories/tools.html"
                    class="nav-link">الأدوات</a></nav>
            <div class="header-actions"><button class="icon-btn" id="themeToggle"><i
                        class="fa-solid fa-moon"></i></button><button class="hamburger" id="menuToggle">☰</button></div>
        </div>
    </header>
    <main class="container">
        <div class="tool-container">
            <h1 class="section-title" style="margin-top:2rem;"><i class="fa-solid fa-calendar-days"></i>مولد جدول الدراسة</h1>
            <p style="text-align:center;color:var(--text-muted)">أضف المادة واليوم ووقت الدراسة، ثم أنشئ جدولك الأسبوعي.
            </p>
            <div class="form-grid">
                <div class="input-group"><label>المادة</label><input id="subject" placeholder="مثال: الرياضيات"></div>
                <div class="input-group"><label>اليوم</label><select id="day">
                        <option>الأحد</option>
                        <option>الإثنين</option>
                        <option>الثلاثاء</option>
                        <option>الأربعاء</option>
                        <option>الخميس</option>
                        <option>الجمعة</option>
                        <option>السبت</option>
                    </select></div>
                <div class="input-group"><label>الوقت</label><input id="time" type="time" value="18:00"></div>
            </div>
            <div class="actions"><button class="btn" id="add"><i class="fa-solid fa-plus"></i> إضافة حصة</button><button
                    class="btn btn-outline" id="clear">مسح الجدول</button></div>
            <div class="schedule" id="schedule"></div>
        </div>
    </main>
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">&copy; <span id="currentYear"></span> Student DZ. جميع الحقوق محفوظة.</div>
        </div>
    </footer>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/navigation.js"></script>
    <script>const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'], schedule = document.getElementById('schedule'); function render() { schedule.innerHTML = ''; days.forEach(d => { const box = document.createElement('div'); box.className = 'day'; box.innerHTML = '<h3>' + d + '</h3>'; const items = JSON.parse(localStorage.getItem('studentSchedule') || '[]').filter(x => x.day === d).sort((a, b) => a.time.localeCompare(b.time)); items.forEach((x, i) => { const el = document.createElement('div'); el.className = 'lesson'; el.textContent = x.time + ' — ' + x.subject; el.title = 'انقر للحذف'; el.onclick = () => { items.splice(i, 1); const all = JSON.parse(localStorage.getItem('studentSchedule') || '[]').filter(y => !(y.day === d && y.time === x.time && y.subject === x.subject)); localStorage.setItem('studentSchedule', JSON.stringify(all)); render() }; box.appendChild(el) }); schedule.appendChild(box) }) } document.getElementById('add').onclick = () => { const subject = document.getElementById('subject').value.trim(); if (!subject) return alert('أدخل اسم المادة.'); const all = JSON.parse(localStorage.getItem('studentSchedule') || '[]'); all.push({ subject, day: document.getElementById('day').value, time: document.getElementById('time').value }); localStorage.setItem('studentSchedule', JSON.stringify(all)); document.getElementById('subject').value = ''; render() }; document.getElementById('clear').onclick = () => { localStorage.removeItem('studentSchedule'); render() }; render();</script>
</body>

</html>
