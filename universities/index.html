<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>دليل الجامعات الجزائرية - Student DZ</title><meta name="description" content="دليل الجامعات والمؤسسات الجامعية في الجزائر."><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="icon" href="../assets/images/icon.png"><script src="../assets/js/config.js"></script></head><body><header class="site-header"><div class="container"><a href="../index.html" class="logo"><img src="../assets/images/icon.png" width="32" height="32"> Student DZ</a><nav class="main-nav" id="mainNav"><a href="../index.html" class="nav-link">الرئيسية</a><a href="../universities/index.html" class="nav-link">الجامعات</a><a href="../ecoles/index.html" class="nav-link">المدارس والمعاهد</a><a href="../residences/index.html" class="nav-link">الإقامات</a><a href="../categories/tools.html" class="nav-link">الأدوات</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button><button class="hamburger" id="menuToggle">☰</button></div></div></header><main class="container"><h1 class="section-title" style="margin-top:2rem"><i class="fa-solid fa-building-columns"></i> دليل الجامعات الجزائرية</h1><div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap"><button id="btnNearMe" class="btn btn-outline">الأقرب إليّ</button><input id="searchInput" style="flex:1;min-width:250px;padding:12px;border:1px solid var(--border-color);border-radius:8px" placeholder="ابحث عن جامعة أو ولاية أو تخصص..."></div><div class="grid" id="univGrid"><p style="grid-column:1/-1;text-align:center">جاري تحميل البيانات...</p></div><div style="text-align:center;margin-top:2rem"><button id="btnLoadMore" class="btn" style="display:none">المزيد من الجامعات</button></div></main><script src="../assets/js/storage.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/favorites-ui.js"></script><script>let universities=[],displayedCount=0,currentData=[];const INITIAL_COUNT=8;function renderGrid(data,append=false){const grid=document.getElementById('univGrid');if(!append){grid.innerHTML='';displayedCount=0}if(!data.length&&!append){grid.innerHTML='<p style="grid-column:1/-1;text-align:center">لا توجد نتائج.</p>';return}const items=data.slice(displayedCount,displayedCount+INITIAL_COUNT);items.forEach(u=>{const map=u.coordinates?`https://www.google.com/maps/dir/?api=1&destination=${u.coordinates.lat},${u.coordinates.lng}`:'#';grid.insertAdjacentHTML('beforeend',`<div class="card favorite-card" data-favorite-id="university:${u.id}" data-favorite-title="${u.name}" data-favorite-url="${u.officialUrl}" data-favorite-type="universities" data-favorite-icon="fa-solid fa-building-columns" data-favorite-description="${u.wilaya||''}"><h3 class="card-title">${u.name}</h3><p class="card-desc">${u.wilaya||''}</p><div>${(u.specialties||[]).map(s=>`<span>${s}</span>`).join('')}</div><div style="display:flex;gap:8px;width:100%;margin-top:auto"><a href="${u.officialUrl}" target="_blank" rel="noopener" class="btn btn-outline" style="flex:1;text-align:center">الموقع</a>${u.coordinates?`<a href="${map}" target="_blank" rel="noopener" class="btn btn-outline" style="flex:1;text-align:center">مسار</a>`:''}</div></div>`)});displayedCount+=items.length;document.getElementById('btnLoadMore').style.display=displayedCount<data.length?'inline-block':'none'}document.addEventListener('DOMContentLoaded',async()=>{const data=await fetchAppJSON(CONFIG.API.UNIVERSITIES);if(data&&data.universities){universities=data.universities;currentData=[...universities];renderGrid(currentData)}});document.getElementById('searchInput').addEventListener('input',e=>{const t=e.target.value.toLowerCase();currentData=universities.filter(u=>u.name.toLowerCase().includes(t)||u.wilaya.toLowerCase().includes(t)||(u.specialties||[]).some(s=>s.toLowerCase().includes(t)));renderGrid(currentData)});document.getElementById('btnLoadMore').addEventListener('click',()=>renderGrid(currentData,true));document.getElementById('btnNearMe').addEventListener('click',()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{currentData=[...universities].map(u=>{u.distance=u.coordinates?Math.hypot((u.coordinates.lat-p.coords.latitude)*111,(u.coordinates.lng-p.coords.longitude)*90):999999;return u}).sort((a,b)=>a.distance-b.distance);renderGrid(currentData)})});</script><script src="../assets/js/navigation.js"></script></body></html>
