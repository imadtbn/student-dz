name: Structured Data - Stage 1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stage-1:
    if: "!contains(github.event.head_commit.message, '[skip schema]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Organization and WebSite structured data
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          schema = '''<!-- Structured Data: Organization + WebSite -->
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@graph": [
              {
                "@type": "Organization",
                "@id": "https://imadtbn.github.io/student-dz/#organization",
                "name": "مساعد الطالب الجزائري student dz",
                "alternateName": "Student DZ",
                "url": "https://imadtbn.github.io/student-dz/",
                "logo": "https://imadtbn.github.io/student-dz/assets/images/icon-512.png",
                "description": "مساعد الطالب الجزائري: منصة رقمية تجمع الأدلة الجامعية والأدوات والخدمات المفيدة للطالب الجزائري.",
                "areaServed": {
                  "@type": "Country",
                  "name": "Algeria"
                },
                "contactPoint": {
                  "@type": "ContactPoint",
                  "telephone": "+213697743721",
                  "email": "tabaniimadeddine@gmail.com",
                  "contactType": "customer support",
                  "availableLanguage": ["ar", "fr"]
                },
                "address": {
                  "@type": "PostalAddress",
                  "postalCode": "35015",
                  "addressCountry": "DZ"
                }
              },
              {
                "@type": "WebSite",
                "@id": "https://imadtbn.github.io/student-dz/#website",
                "url": "https://imadtbn.github.io/student-dz/",
                "name": "مساعد الطالب الجزائري | Student DZ",
                "alternateName": "Student DZ",
                "inLanguage": "ar-DZ",
                "publisher": {
                  "@id": "https://imadtbn.github.io/student-dz/#organization"
                },
                "potentialAction": {
                  "@type": "SearchAction",
                  "target": {
                    "@type": "EntryPoint",
                    "urlTemplate": "https://imadtbn.github.io/student-dz/?q={search_term_string}"
                  },
                  "query-input": "required name=search_term_string"
                }
              }
            ]
          }
          </script>'''

          pattern = r'(?is)<!-- Structured Data: Organization.*?</script>'
          if not re.search(pattern, html):
              raise SystemExit('Existing structured-data block not found')
          html = re.sub(pattern, schema, html, count=1)
          path.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/structured-data-stage-1.yml')
          workflow.unlink()

      - name: Commit stage 1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/structured-data-stage-1.yml
          git commit -m "Structured Data: stage 1 organization and website [skip schema]"
          git push
