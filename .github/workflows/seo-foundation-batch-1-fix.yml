name: Student DZ SEO Foundation — Batch 1 Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize core SEO metadata and sitemap
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          from xml.sax.saxutils import escape

          BASE = 'https://imadtbn.github.io/student-dz'
          SOCIAL = BASE + '/assets/images/social-preview.png'
          pages = {
              'index.html': ('مساعد الطالب الجزائري | Student DZ', 'منصة مساعد الطالب الجزائري للخدمات الجامعية والمعلومات التعليمية والموارد الدراسية والأدوات الرقمية في مكان واحد.'),
              'universities/index.html': ('دليل الجامعات الجزائرية | Student DZ', 'دليل الجامعات الجزائرية والكليات والتخصصات، مع معلومات ومواقع الجامعات المتاحة للطالب الجزائري.'),
              'ecoles/index.html': ('دليل المدارس والمعاهد الجزائرية | Student DZ', 'دليل المدارس العليا والمعاهد في الجزائر، مع البحث حسب المؤسسة والولاية والتخصص.'),
              'residences/index.html': ('دليل الإقامات الجامعية في الجزائر | Student DZ', 'دليل الإقامات الجامعية في الجزائر لمساعدة الطالب على البحث عن الإقامة وموقعها ومعلوماتها المتاحة.'),
              'platforms/index.html': ('المنصات الرسمية للطالب الجزائري | Student DZ', 'دليل المنصات والخدمات الرقمية الرسمية التي يحتاجها الطالب الجزائري خلال مساره الدراسي.'),
              'transport/index.html': ('النقل الجامعي للطالب الجزائري | Student DZ', 'أداة ومعلومات النقل الجامعي لمساعدة الطالب الجزائري على الوصول بين الجامعة والإقامة أو المحطة.'),
              'categories/tools.html': ('أدوات الطالب الجزائري | Student DZ', 'مجموعة أدوات رقمية مجانية ومفيدة للطالب الجزائري، من حساب المعدل وتنظيم الوقت إلى أدوات الدراسة والإنتاجية.'),
              'categories/student-life.html': ('الحياة الجامعية | Student DZ', 'موارد وخدمات وأدوات تساعد الطالب الجزائري في حياته الجامعية والدراسة والتنظيم اليومي.'),
              'pages/about.html': ('عن Student DZ | مساعد الطالب الجزائري', 'تعرف على منصة Student DZ ومهمتها في جمع الأدوات والمعلومات والخدمات المفيدة للطالب الجزائري في مكان واحد.'),
              'pages/contact.html': ('اتصل بنا | Student DZ', 'تواصل مع فريق Student DZ لإرسال الملاحظات والاقتراحات والإبلاغ عن الأخطاء المتعلقة بالموقع والمحتوى.'),
              'pages/guides.html': ('دليل استخدام Student DZ | مساعد الطالب الجزائري', 'دليل استخدام منصة Student DZ للوصول إلى الجامعات والمدارس والإقامات والمنصات والأدوات والخدمات المتاحة.'),
              'pages/privacy.html': ('سياسة الخصوصية | Student DZ', 'سياسة الخصوصية لمنصة Student DZ وشرح عام لكيفية التعامل مع بيانات التصفح والتخزين والخدمات المستخدمة.'),
          }

          def canonical(path):
              if path == 'index.html': return BASE + '/'
              if path.endswith('/index.html'): return BASE + '/' + path[:-10].rstrip('/') + '/'
              return BASE + '/' + path

          def remove_seo(html):
              html = re.sub(r'(?is)\s*<link\b[^>]*\brel=["\']canonical["\'][^>]*>\s*', '\n', html)
              html = re.sub(r'(?is)\s*<meta\b[^>]*\bname=["\']description["\'][^>]*>\s*', '\n', html)
              html = re.sub(r'(?is)\s*<meta\b[^>]*\bname=["\']robots["\'][^>]*>\s*', '\n', html)
              html = re.sub(r'(?is)\s*<meta\b[^>]*\bproperty=["\']og:[^"\']+["\'][^>]*>\s*', '\n', html)
              html = re.sub(r'(?is)\s*<meta\b[^>]*\bname=["\']twitter:[^"\']+["\'][^>]*>\s*', '\n', html)
              return html

          def inject(html, title, desc, url, robots='index, follow'):
              html = remove_seo(html)
              html = re.sub(r'(?is)<title>.*?</title>', f'<title>{title}</title>', html, count=1)
              block = f'''\n    <!-- SEO Foundation -->\n    <link rel="canonical" href="{url}">\n    <meta name="description" content="{desc}">\n    <meta name="robots" content="{robots}">\n\n    <!-- Open Graph -->\n    <meta property="og:type" content="website">\n    <meta property="og:site_name" content="Student DZ | مساعد الطالب الجزائري">\n    <meta property="og:locale" content="ar_DZ">\n    <meta property="og:url" content="{url}">\n    <meta property="og:title" content="{title}">\n    <meta property="og:description" content="{desc}">\n    <meta property="og:image" content="{SOCIAL}">\n    <meta property="og:image:secure_url" content="{SOCIAL}">\n    <meta property="og:image:type" content="image/png">\n    <meta property="og:image:width" content="1200">\n    <meta property="og:image:height" content="630">\n    <meta property="og:image:alt" content="{title}">\n\n    <!-- Twitter -->\n    <meta name="twitter:card" content="summary_large_image">\n    <meta name="twitter:title" content="{title}">\n    <meta name="twitter:description" content="{desc}">\n    <meta name="twitter:image" content="{SOCIAL}">\n    <meta name="twitter:image:alt" content="{title}">\n'''
              return html.replace('</head>', block + '    </head>', 1)

          for path, (title, desc) in pages.items():
              p = Path(path)
              if p.exists():
                  p.write_text(inject(p.read_text(encoding='utf-8'), title, desc, canonical(path)), encoding='utf-8')
                  print('UPDATED', path)

          special = {
              '404.html': ('الصفحة غير موجودة | Student DZ', 'الصفحة التي تبحث عنها غير موجودة في منصة Student DZ.'),
              'offline.html': ('أنت غير متصل | Student DZ', 'تعذر الاتصال بالإنترنت. يمكنك العودة عند توفر الاتصال لإكمال التصفح.')
          }
          for path, (title, desc) in special.items():
              p = Path(path)
              if p.exists():
                  p.write_text(inject(p.read_text(encoding='utf-8'), title, desc, BASE + '/' + path, 'noindex, follow'), encoding='utf-8')

          Path('robots.txt').write_text(f'User-agent: *\nAllow: /student-dz/\n\nSitemap: {BASE}/sitemap.xml\n', encoding='utf-8')

          urls = []
          for p in Path('.').rglob('*.html'):
              s = p.as_posix()
              if s.startswith('.git/') or s in {'404.html', 'offline.html'}:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              if not text.strip():
                  continue
              urls.append(canonical(s))
          urls = sorted(set(urls))
          xml = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          xml += [f'  <url><loc>{escape(u)}</loc></url>' for u in urls]
          xml.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(xml) + '\n', encoding='utf-8')
          print('SITEMAP', len(urls))
          PY

      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/seo-foundation-batch-1-fix.yml
          git add index.html universities/index.html ecoles/index.html residences/index.html platforms/index.html transport/index.html categories/tools.html categories/student-life.html pages/about.html pages/contact.html pages/guides.html pages/privacy.html 404.html offline.html robots.txt sitemap.xml .github/workflows/seo-foundation-batch-1-fix.yml
          git commit -m "SEO: normalize canonical OG Twitter robots and sitemap"
          git push
