cript><script>const tools=[['budget-calculator.html','حاسبة الميزانية','احسب مصاريفك الشهرية والسنوية','fa-solid fa-wallet'],['text-tools.html','أدوات النصوص','عداد الكلمات وتنسيق النصوص للبحوث','fa-solid fa-font'],['average-calculator.html','حاسبة المعدل','احسب معدل السداسي','fa-solid fa-calculator'],['semester-calculator.html','المعدل السنوي','احسب المعدل السنوي','fa-solid fa-chart-bar'],['percentage-calculator.html','حساب النسبة','حساب النسبة المئوية','fa-solid fa-percent'],['pomodoro.html','مؤقت بومودورو','نظم وقت دراستك','fa-solid fa-stopwatch'],['notes-calendar.html','سجل الملاحظات والمواعيد','دوّن ملاحظاتك ومهامك ومواعيدك','fa-solid fa-calendar-check'],['research-plan.html','مولّد خطة البحث','أنشئ هيكل مذكرة التخرج','fa-solid fa-diagram-project'],['apa-generator.html','مولّد المراجع APA','أنشئ مراجع APA 7','fa-solid fa-book-bookmark'],['cv-builder.html','إنشاء CV','أنشئ سيرتك الذاتية','fa-solid fa-file-invoice'],['qr-generator.html','إنشاء QR Code','تحويل نص أو رابط لرمز','fa-solid fa-qrcode'],['pdf-tools.html','أدوات PDF','دمج ملفات PDF','fa-solid fa-file-pdf'],['image-compressor.html','ضغط الصور','تصغير حجم الصور','fa-solid fa-image'],['maps.html','الخريطة الجامعية','الجامعات والإقامات','fa-solid fa-map-location-dot'],['unit-converter.html','محول الوحدات','تحويل الوحدات','fa-solid fa-right-left'],['study-schedule.html','مولد جدول الدراسة','أنشئ جدولك الأسبوعي','fa-solid fa-calendar-days'],['date-difference.html','حساب الأيام بين تاريخين','احسب المدة بالأيام والأسابيع','fa-solid fa-calendar-week'],['points-ranking.html','حاسبة الترتيب والنقاط','احسب مجموع النقاط والمتوسط الموزون','fa-solid fa-ranking-star']];const grid=document.getElementById('toolsGrid');tools.forEach((t,i)=>{grid.insertAdjacentHTML('beforeend',`<div class="card tool-card favorite-card ${i>8?'extra-tool-card':''}" data-favorite-id="tool:${t[0]}" data-favorite-title="${t[1]}" data-favorite-url="../tools/${t[0]}" data-favorite-type="tools" data-favorite-icon="${t[3]}" data-favorite-description="${t[2]}"><a class="card-link" href="../tools/${t[0]}"><div class="card-icon"><i class="${t[3]}"></i></div><h3 class="card-title">${t[1]}</h3><p class="card-desc">${t[2]}</p></a></div>`)});const extras=document.querySelectorAll('.extra-tool-card'),btn=document.getElementById('moreToolsBtn');extras.forEach(c=>c.hidden=true);btn.onclick=()=>{const show=extras[0]?.hidden;extras.forEach(c=>c.hidden=!show);btn.textContent=show?'إخفاء الأدوات الإضافية':'المزيد من الأدوات';btn.setAttribute('aria-expanded',String(show))};document.getElementById('currentYear').textContent=new Date().getFullYear();</script></body></html>
